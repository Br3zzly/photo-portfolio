<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="bar">
  <div class="bar-title">
    <button id="back" class="back" hidden aria-label="All photographs">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span id="where">Portfolio <span class="bar-sub">admin</span></span>
  </div>
  <div class="bar-actions">
    <span id="count" class="count"></span>
    <button id="add-files" class="btn">Add photos…</button>
    <button id="add-folder" class="btn">Add folder as album…</button>
  </div>
</header>

<!-- The pickers. Hidden: the buttons above drive them, so the browser's own
     file dialog is what opens. A folder pick carries webkitRelativePath, which
     is where the album name comes from. -->
<input id="pick-files"  type="file" multiple accept="image/*" hidden>
<input id="pick-folder" type="file" multiple webkitdirectory hidden>

<main>
  <p id="status" class="status">Loading the manifest…</p>
  <div id="grid" class="grid"></div>
</main>

<!-- dropping anywhere on the page stages the files -->
<div id="drop" class="drop">
  <div class="drop-inner">Drop photographs to add them<br>
    <span class="drop-note">a folder becomes an album</span></div>
</div>

<!-- The review sheet: everything picked, one after another, with whatever the
     camera recorded already filled in. -->
<section id="review" class="sheet" hidden>
  <div class="sheet-head">
    <div>
      <h2 id="review-title">Review</h2>
      <p id="review-sub" class="sheet-sub"></p>
    </div>
    <div class="sheet-actions">
      <button id="review-cancel" class="btn">Discard</button>
      <button id="review-publish" class="btn primary">Publish</button>
    </div>
  </div>
  <div id="review-list" class="review-list"></div>
</section>

<!-- Progress, and the only place errors surface. A bar rather than a page:
     the detail is on the terminal, and what matters here is how far along it
     is and whether it failed. -->
<div id="progress" class="progress" hidden>
  <div class="progress-row">
    <span id="progress-title" class="progress-title"></span>
    <span id="progress-label" class="progress-label"></span>
    <button id="progress-close" class="progress-close" hidden aria-label="Dismiss">&times;</button>
  </div>
  <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
</div>

<!-- what is selected, and what can be done with it -->
<div id="selbar" class="selbar" hidden>
  <span id="selcount" class="selcount"></span>
  <button id="sel-clear" class="btn">Clear</button>
  <button id="sel-delete" class="btn danger">Delete</button>
</div>

<div id="confirm" class="modal" hidden>
  <div class="modal-card">
    <h3 id="confirm-title">Delete?</h3>
    <p id="confirm-body" class="modal-body"></p>
    <div class="modal-actions">
      <button id="confirm-no" class="btn">Cancel</button>
      <button id="confirm-yes" class="btn danger">Delete from Cloudflare</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
