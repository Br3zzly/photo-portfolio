<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="description" content="Photographs at full resolution. Zoom in.">

<meta property="og:title" content="Portfolio">
<meta property="og:description" content="Photographs at full resolution. Zoom in.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://pub-9775c4eec7a34ee9bedf8364e574d557.r2.dev" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">

<link rel="stylesheet" href="assets/style.css?v=35">

<!-- Every module URL is versioned in this one place. Bump the number here and
     in the stylesheet link above whenever you change the CSS or any of the JS.
     It does not publish anything sooner -- Pages caches this file for ten
     minutes too, so nobody sees a new number until then. What it buys is that
     the assets can never be staler than the HTML pointing at them: bumping
     makes them URLs the browser has no copy of, so the two arrive as a set. -->
<script type="importmap">
{
  "imports": {
    "app/manifest": "./assets/modules/manifest.js?v=35",
    "app/grid":     "./assets/modules/grid.js?v=35",
    "app/viewer":   "./assets/modules/viewer.js?v=35",
    "app/lightbox": "./assets/modules/lightbox.js?v=35"
  }
}
</script>
</head>
<body>

<button class="back" id="back" aria-label="All photographs" hidden>
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<main>
  <div id="grid" class="grid" role="list"></div>

  <p id="status" class="status">Loading…</p>
</main>

<!-- The lightbox sits above the gallery, which stays in the DOM and gets
     blurred behind it. -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-scrim"></div>

  <button class="close" id="close" aria-label="Back to gallery">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button class="nav prev" id="prev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.25"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="nav next" id="next" aria-label="Next photo">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.25"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="stage" id="stage">
    <!-- image and plate are one unit, sized together, so the plate is always
         exactly as wide as the photograph above it -->
    <figure class="card" id="card">
      <div class="frame" id="frame">
        <!-- the tiny placeholder shows instantly; OpenSeadragon draws over it -->
        <img class="placeholder" id="placeholder" alt="" aria-hidden="true">
        <div class="viewer" id="viewer"></div>
      </div>

      <!-- camera and lens on the left; the maker's mark and the settings,
           with the date beneath them, on the right -->
      <figcaption class="plate" id="plate">
        <div class="plate-left">
          <span class="plate-camera" id="m-camera"></span>
          <span class="plate-lens" id="m-lens"></span>
        </div>
        <div class="plate-right">
          <div class="plate-mark" id="m-mark"></div>
          <div class="plate-settings">
            <span class="plate-spec" id="m-spec"></span>
            <span class="plate-date" id="m-date"></span>
          </div>
        </div>
      </figcaption>
    </figure>
  </div>
</div>

<script src="assets/openseadragon.min.js" defer></script>
<script type="module" src="assets/app.js?v=35"></script>
</body>
</html>
