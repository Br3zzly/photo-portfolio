<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="description" content="Photographs at full resolution. Zoom in.">

<meta property="og:title" content="Portfolio">
<meta property="og:description" content="Photographs at full resolution. Zoom in.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://pub-9775c4eec7a34ee9bedf8364e574d557.r2.dev" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&display=swap">

<link rel="stylesheet" href="assets/style.css?v=12">

<script>
  // Runs before first paint so a saved choice never flashes the wrong theme.
  // No saved choice means we leave it alone and the CSS follows the system.
  try {
    var saved = localStorage.getItem("theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) { /* private mode: fall through to the system preference */ }
</script>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark">
  <svg class="moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"
          fill="none" stroke="currentColor" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <svg class="sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"
          stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
</button>

<header class="masthead" id="masthead">
  <h1>Portfolio</h1>
  <p class="tagline">Photographs at full resolution. Click one, then zoom in.</p>
</header>

<div class="album-head" id="album-head" hidden>
  <button class="back" id="back">
    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    All photographs
  </button>
  <h2 id="album-title"></h2>
  <p class="album-sub" id="album-sub"></p>
</div>

<main>
  <div id="grid" class="grid" role="list"></div>

  <p id="status" class="status">Loading…</p>
</main>

<footer class="colophon">
  <span id="count"></span>
</footer>


<!-- The lightbox sits above the gallery, which stays in the DOM and gets
     blurred behind it. -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-scrim"></div>

  <button class="close" id="close" aria-label="Back to gallery">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button class="nav prev" id="prev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.25"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="nav next" id="next" aria-label="Next photo">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.25"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="stage" id="stage">
    <!-- image and plate are one unit, sized together, so the plate is always
         exactly as wide as the photograph above it -->
    <figure class="card" id="card">
      <div class="frame" id="frame">
        <!-- the tiny placeholder shows instantly; OpenSeadragon draws over it -->
        <img class="placeholder" id="placeholder" alt="" aria-hidden="true">
        <div class="viewer" id="viewer"></div>
      </div>

      <figcaption class="plate" id="plate">
        <div class="plate-text">
          <span class="plate-body" id="m-camera"></span>
          <span class="plate-spec" id="m-spec"></span>
        </div>
        <div class="plate-mark" id="m-mark"></div>
      </figcaption>
    </figure>
  </div>
</div>

<script src="assets/openseadragon.min.js" defer></script>
<script src="assets/app.js?v=12" defer></script>
</body>
</html>
